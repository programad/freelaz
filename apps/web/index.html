        "operatingSystem": "Any",
        "inLanguage": "pt-BR",

          "@type": "Offer",
          "price": "0",

        },

          "@type": "Audience",
          "audienceType": "Freelancers brasileiros"
        }
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Como calcular minha taxa horária como freelancer no Brasil?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Calcule somando seu custo de vida mensal, reserva de emergência, gastos extras e impostos, depois divida pelas horas de trabalho mensais. A Freelaz faz isso automaticamente, ajustando pela sua região e pela localização do cliente."
            }
          },
          {
            "@type": "Question",
            "name": "Quanto cobrar de cliente americano sendo freelancer brasileiro?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Para clientes americanos, considere o poder de compra local, a taxa praticada por desenvolvedores nos EUA e benefícios fiscais como exportação de serviços (MEI a partir de 6%). A Freelaz calcula a faixa competitiva por cidade do cliente."
            }
          },
          {
            "@type": "Question",
            "name": "Como considerar impostos ao precificar como freelancer?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Some o percentual de impostos ao seu custo total e ajuste sua taxa bruta para que o líquido cubra suas necessidades. MEI permite alíquotas reduzidas em exportação de serviços, em geral entre 6% e 11,2%."
            }
          },
          {
            "@type": "Question",
            "name": "Vale a pena cobrar em dólar como freelancer brasileiro?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sim — a diferença cambial somada à exportação de serviços costuma resultar em ganho líquido significativamente maior do que clientes nacionais, mesmo aplicando descontos competitivos."
            }
          }
        ]
      }
    </script>
